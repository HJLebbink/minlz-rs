name: Fuzz

# Short fuzz pass per target on every push to main + nightly cron.
# Corpus is not committed to the repo (see `.gitignore`); each fresh
# run starts bare and the cache step accumulates seeds across runs.
# Long-form fuzzing (≥ 20 min/target) happens locally per the
# `crates/minlz/fuzz/RUNBOOK.md` checklist before tagged releases.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # every night 04:00 UTC
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Seconds per target (default 300)"
        required: false
        default: "300"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: cargo fuzz run (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_arbitrary
          - roundtrip
          - stream_decode_arbitrary
          - stream_roundtrip
          - index_load
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/minlz/fuzz -> target
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Persistent corpus across runs.  No in-tree seeds; cache
      # bootstraps the coverage frontier from the prior run.
      - name: Restore corpus cache
        id: cache-corpus
        uses: actions/cache@v4
        with:
          path: crates/minlz/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: |
          cd crates/minlz/fuzz
          mkdir -p corpus/${{ matrix.target }}
          DUR="${{ github.event.inputs.duration_secs || '300' }}"
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
              -max_total_time="$DUR" \
              -jobs="$(nproc)" -workers="$(nproc)" \
              -max_len=1048576

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/minlz/fuzz/artifacts/${{ matrix.target }}/

      - name: Upload coverage-growth corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: crates/minlz/fuzz/corpus/${{ matrix.target }}/
          retention-days: 7
